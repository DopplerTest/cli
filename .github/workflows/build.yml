name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25' # GO_VERSION_DEF
        check-latest: true
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        path: ./src/github.com/${{ github.repository }}
    - name: Mint a token for the private agent-proxy module
      id: agent-proxy-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: agent-proxy
    - name: Authenticate to the private agent-proxy module
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/DopplerTest/".insteadOf "https://github.com/DopplerTest/"
        echo "GOPRIVATE=github.com/DopplerTest/*" >> "$GITHUB_ENV"
      env:
        TOKEN: ${{ steps.agent-proxy-token.outputs.token }}
    - name: Build
      run: make build
      env:
        GOPATH: ${{ runner.workspace }}

  check:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25' # GO_VERSION_DEF
        check-latest: true
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      with:
        path: ./src/github.com/${{ github.repository }}
    - name: GoReleaser Check
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: latest
        args: check
      env:
        GOPATH: ${{ runner.workspace }}
