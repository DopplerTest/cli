name: release-demo

# Build the `doppler-agent` preview (this CLI fork, which bundles the agent-proxy) and
# publish it to GCS for pilot customers. Manual trigger only; entirely separate from the
# production `release` workflow.
#
# agent-proxy is a private module (github.com/DopplerTest/agent-proxy), so the runner
# needs read access to fetch it — see the "private module access" step below. The
# customer never touches it: agent-proxy is statically linked into the shipped binary.
#
# Secrets used (demo-scoped, distinct from the production release):
#   GCP_KEY_DEMO    — service-account key with write access to the demo bucket.
#   AGENT_PROXY_PAT — token with read access to DopplerTest/agent-proxy, so `go` can fetch
#                     the private module during the build. (Interim: migrate to a GitHub
#                     App token later — swap this for a create-github-app-token mint step.)
# Publishes to the doppler-proxy-alpha GCS bucket (objects must be public-read for install).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  DEMO_BUCKET: doppler-proxy-alpha

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Private module access (github.com/DopplerTest/agent-proxy)
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/DopplerTest/".insteadOf \
            "https://github.com/DopplerTest/"
          echo "GOPRIVATE=github.com/DopplerTest/*" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ secrets.AGENT_PROXY_PAT }}

      - name: Write GCP credentials
        run: |
          printf '%s' "$GCP_KEY_DEMO" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
        env:
          GCP_KEY_DEMO: ${{ secrets.GCP_KEY_DEMO }}

      - name: Install goreleaser
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install -y goreleaser

      - name: Validate config
        run: goreleaser check -f .goreleaser.demo.yml

      - name: Build + upload archives to GCS
        # No git tag: the demo owns its own version, decoupled from the CLI's vX.Y.Z tag
        # history (the fork inherits those back to 2019, so `git tag v0.1.1` collides).
        # GORELEASER_CURRENT_TAG feeds goreleaser the version directly; --skip=validate
        # drops the "tag points at HEAD" check (there's no tag) and the dirty-tree check
        # (a fresh CI checkout is clean anyway). --snapshot is not an option — it rewrites
        # the version to 0.1.1-SNAPSHOT-<sha>, which stops matching the install-demo.sh name.
        run: goreleaser release -f .goreleaser.demo.yml --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}

      - name: Publish the latest marker + install script
        run: |
          printf '%s' "${{ inputs.version }}" | gcloud storage cp - "gs://${DEMO_BUCKET}/doppler-agent/latest"
          gcloud storage cp scripts/install-demo.sh "gs://${DEMO_BUCKET}/install.sh"
